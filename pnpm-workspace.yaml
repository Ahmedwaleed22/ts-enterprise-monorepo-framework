packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  # Left uncompiled: `packages/database` falls back to Node's built-in
  # `node:sqlite`, and Drizzle — which has no `node:sqlite` driver — loads
  # better-sqlite3 through the prebuilt binaries it ships. Set to true only if a
  # platform without a prebuild ever needs to compile from source.
  better-sqlite3: false
  esbuild: true
  less: true
  nx: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - tsx@4.23.11
onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - esbuild
