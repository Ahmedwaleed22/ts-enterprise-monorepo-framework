packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  # Left unbuilt: the sqlite driver falls back to Node's built-in `node:sqlite`.
  # Set to true to compile the native module and use better-sqlite3 instead.
  better-sqlite3: false
  esbuild: true
  less: true
  nx: true
  sharp: set this to true or false
  unrs-resolver: set this to true or false
minimumReleaseAgeExclude:
  - tsx@4.23.11
onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - esbuild
